// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 21
        compileSdkVersion = 35
        targetSdkVersion = 34

        ndkVersion = "29.0.14206865"
        kotlinVersion = "1.9.24" // Or any version above 1.3.x
        RNNKotlinVersion = kotlinVersion

        // https://github.com/DylanVann/react-native-fast-image/blob/9ab80fcd570b7f56da66ab20e52c9a35934067c9/docs/app-glide-module.md
        // https://github.com/dream-horizon-org/react-native-fast-image/blob/main/docs/app-glide-module.md
        excludeAppGlideModule = true
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath('com.android.tools.build:gradle:8.6.1')
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

// 强制所有子模块使用与根项目一致的 NDK 版本
subprojects {
    // 压制依赖库产生的编译警告:
    // - [dep-ann] deprecated item is not annotated with @Deprecated (audiotagger)
    // - [removal] 使用标记为移除的 RN API (react-native-svg 的 com.facebook.react.common.StandardCharsets)
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:-dep-ann', '-Xlint:-removal']
    }
    plugins.withId('com.android.library') { 
        android { 
            ndkVersion rootProject.ext.ndkVersion 
        } 
    }
    plugins.withId('com.android.application') { 
        android { 
            ndkVersion rootProject.ext.ndkVersion 
        } 
    }
}
